name: atlas-ci
# Formatting and the launcher's tests (library and binary targets, on Linux the owner_gate test too) on Linux and
# Windows, and the Windows installer end to end, for every push and pull request.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  launcher:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-ci
      - name: Linux libraries GPUI links to
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - run: cargo fmt --manifest-path launcher/Cargo.toml --check
      - run: cargo test --manifest-path launcher/Cargo.toml --release --lib --bins --test owner_gate

  # The Windows installer builds and runs only on Windows (launcher/src/installer.rs, installer_atlas.rs): the
  # launcher's tests there, then the installer end to end in a scratch profile (tools/atlas_installer_e2e.ps1).
  windows:
    runs-on: windows-latest
    # Two release builds (the test harness and the launcher), on a cold cache now and then.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-ci-windows
      - run: cargo test --manifest-path launcher/Cargo.toml --release --lib --bins
      - run: cargo build --manifest-path launcher/Cargo.toml --release
      - name: The installer, end to end
        shell: pwsh
        run: ./tools/atlas_installer_e2e.ps1 -Launcher launcher/target/release/horizon-launcher.exe
