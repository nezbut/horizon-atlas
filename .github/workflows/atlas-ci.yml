name: atlas-ci
# Formatting and the launcher's tests (library and binary targets) on Linux, for every push and pull request.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  launcher:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-ci
      - name: Linux libraries GPUI links to
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - run: cargo fmt --manifest-path launcher/Cargo.toml --check
      - run: cargo test --manifest-path launcher/Cargo.toml --release --lib --bins
