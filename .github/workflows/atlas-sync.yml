name: atlas-sync
# Follows Horizon's launcher releases (tools/atlas_sync.py). Twice a day (04:17 and 16:17 UTC), and by hand:
#  - build: when upstream has a launcher@X.Y.Z newer than the one main is based on, replay Atlas's patches onto it,
#    drop the upstream workflows that came with it (Atlas's own are named atlas-*), and run the formatting check and the
#    launcher's tests. Success hands a git bundle of the rebased main to `publish`. A failure hands an issue's title and
#    body to `report`, which also opens a non-blocking issue when upstream changed how the launcher is built
#    (atlas-release.yml is a derived copy of upstream's launcher.yml and has to be compared by hand).
#  - publish: pushes the rebased main and starts atlas-release.yml. Nothing is pushed or published unless build
#    succeeded, and not in a dry run (a by-hand run with dry_run on, the default; scheduled runs are not dry runs).
#  - main-check: once a day (the 04:17 UTC run, and by hand): do the patches still apply to, and build on, upstream's
#    main? It never pushes or publishes. A failure
#    hands an issue to `report-main`, which opens one labelled sync-main (only one at a time).
# Needs the repository secret SYNC_TOKEN, a fine-grained personal access token (contents, workflows, actions, issues:
# read and write): the workflow's own token can neither push commits that change .github/workflows nor start another
# workflow. SYNC_TOKEN is read only by `publish`, which runs no repository code: cargo, tests, build scripts and
# dependencies run in `build` and `main-check` (code from upstream and third parties), which never see it; the issue
# jobs use the workflow's own token and run no repository code either.

on:
  schedule:
    # The launcher tags are checked on both runs; main-check only on the first (see its `if`).
    - cron: '17 4 * * *'
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rebase and test, report what would be pushed and released, but push and release nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: atlas-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/horizon-rust/horizon.git
  HORIZON_TELEMETRY_URL: "off"

jobs:
  build:
    # The rebased main is published to main: only a run on main may do that.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.bundle.outputs.ok }}
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
      expected: ${{ steps.find.outputs.expected }}
      notice: ${{ steps.drift.outputs.notice }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Upstream's launcher tags
        run: |
          git config user.name "atlas-sync"
          git config user.email "atlas-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream '+refs/tags/launcher@*:refs/upstream/tags/launcher@*'
      - name: A new upstream launcher tag?
        id: find
        run: |
          set -euo pipefail
          tag=$(python3 tools/atlas_sync.py new-tag)
          # The version, the main this run started from and the tag it is based on, taken before the rebase.
          version=$(python3 tools/atlas_sync.py next-version)
          expected=$(git rev-parse HEAD)
          base=
          if [[ -n "$tag" ]]; then base=$(python3 tools/atlas_sync.py base); fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "expected=$expected"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          echo "### New upstream launcher tag: ${tag:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Atlas's patches onto the new tag
        id: rebase
        if: steps.find.outputs.tag != ''
        env:
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          # Exit 1 with FAILED_PATCH=<subject> is a conflict; exit 1 without it, another reason (stderr says which).
          # On a conflict the tool also writes conflict.md: where it conflicts, what upstream changed, what the patch changes.
          status=0
          python3 tools/atlas_sync.py rebase "$TAG" --report "$RUNNER_TEMP/conflict.md" > "$RUNNER_TEMP/rebase.out" 2> "$RUNNER_TEMP/rebase.err" || status=$?
          cat "$RUNNER_TEMP/rebase.out" "$RUNNER_TEMP/rebase.err"
          [[ $status == 0 ]] && exit 0
          failed_patch=$(sed -n 's/^FAILED_PATCH=//p' "$RUNNER_TEMP/rebase.out" | head -n 1)
          if [[ -n "$failed_patch" ]]; then
            title="Sync to $TAG failed: $failed_patch"
            reason="The patch \`$failed_patch\` no longer applies to $TAG."
          else
            title="Sync to $TAG failed: the rebase did not start or finish"
            reason="The rebase onto $TAG failed for a reason other than a conflicting patch (see the log below)."
          fi
          mkdir report
          printf '%s\n' "$title" > report/title.txt
          {
            echo "$reason Nothing was pushed or published; main is unchanged."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [[ -n "$failed_patch" ]]; then
              echo 'To fix this with an agent, use the `atlas-issues` skill (.claude/skills/atlas-issues)'
              echo
              if [[ -s "$RUNNER_TEMP/conflict.md" ]]; then cat "$RUNNER_TEMP/conflict.md"; fi
            else
              echo '````'
              tail -n 80 "$RUNNER_TEMP/rebase.err"
              echo '````'
            fi
          } > "$RUNNER_TEMP/body.md"
          head -c 60000 "$RUNNER_TEMP/body.md" > report/body.md
          exit 1
      - name: Upstream's workflows, dropped (Atlas's own are atlas-*)
        if: steps.find.outputs.tag != ''
        run: |
          set -euo pipefail
          dropped=$(python3 tools/atlas_sync.py drop-workflows)
          echo "### Upstream workflows dropped: ${dropped:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Did upstream change how the launcher is built?
        id: drift
        if: steps.find.outputs.tag != ''
        env:
          TAG: ${{ steps.find.outputs.tag }}
          BASE: ${{ steps.find.outputs.base }}
        run: |
          # Not a failure: atlas-release.yml is a copy of upstream's launcher.yml, so a change there needs a human.
          paths=(.github/workflows/launcher.yml packaging tools/ci/sign_release.sh)
          if git diff --quiet "refs/upstream/tags/$BASE" "refs/upstream/tags/$TAG" -- "${paths[@]}"; then
            echo "The launcher's build is unchanged between $BASE and $TAG"
            exit 0
          fi
          mkdir -p report
          printf '%s\n' "Upstream changed the launcher's build in $TAG: compare atlas-release.yml" > report/notice-title.txt
          {
            echo "Between $BASE and $TAG upstream changed how the launcher is built, packaged or signed."
            echo
            echo "\`.github/workflows/atlas-release.yml\` is a derived copy of upstream's \`.github/workflows/launcher.yml\`, so it did not follow. Compare it with \`launcher.yml\` at \`$TAG\` and port what matters. The sync itself went on: this notice blocks nothing."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            git diff --stat "refs/upstream/tags/$BASE" "refs/upstream/tags/$TAG" -- "${paths[@]}"
            echo '```'
          } > report/notice-body.md
          echo "notice=true" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.find.outputs.tag != ''
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.find.outputs.tag != ''
        with:
          workspaces: launcher
          shared-key: launcher-sync
      - name: Linux libraries GPUI links to
        if: steps.find.outputs.tag != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Format check and tests
        if: steps.find.outputs.tag != ''
        env:
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          # Both run, so the report says which failed (or that both did).
          fmt=0
          tests=0
          (cd launcher && cargo fmt --check) > "$RUNNER_TEMP/fmt.log" 2>&1 || fmt=$?
          (cd launcher && cargo test --release --lib --bins) > "$RUNNER_TEMP/tests.log" 2>&1 || tests=$?
          tail -n 60 "$RUNNER_TEMP/fmt.log" "$RUNNER_TEMP/tests.log"
          [[ $fmt == 0 && $tests == 0 ]] && exit 0
          # The useful part of a log: the test failures, else the compiler errors, else the end.
          excerpt() {
            if grep -q '^failures:' "$1"; then
              sed -n '/^failures:/,$p' "$1" | head -n 150
            elif grep -q '^error' "$1"; then
              grep -A12 '^error' "$1" | head -n 150
            else
              tail -n 60 "$1"
            fi
          }
          if [[ $fmt != 0 && $tests != 0 ]]; then
            what='both `cargo fmt --check` and `cargo test --release --lib --bins`'
          elif [[ $fmt != 0 ]]; then
            what='`cargo fmt --check`'
          else
            what='`cargo test --release --lib --bins`'
          fi
          mkdir -p report
          printf '%s\n' "Sync to $TAG failed: cargo fmt or the tests" > report/title.txt
          {
            echo "Atlas's patches applied to $TAG, but $what failed in \`launcher/\`. Nothing was pushed or published; main is unchanged."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [[ $fmt != 0 ]]; then
              echo
              echo 'Output of `cargo fmt --check` (the first 150 lines):'
              echo
              echo '````'
              head -n 150 "$RUNNER_TEMP/fmt.log"
              echo '````'
            fi
            if [[ $tests != 0 ]]; then
              echo
              echo 'Output of `cargo test --release --lib --bins` (the failures, else the compiler errors, else the last lines):'
              echo
              echo '````'
              excerpt "$RUNNER_TEMP/tests.log"
              echo '````'
            fi
          } > "$RUNNER_TEMP/body.md"
          head -c 60000 "$RUNNER_TEMP/body.md" > report/body.md
          exit 1
      - name: The rebased main, as a bundle of its new commits
        id: bundle
        if: steps.find.outputs.tag != ''
        env:
          EXPECTED: ${{ steps.find.outputs.expected }}
          TAG: ${{ steps.find.outputs.tag }}
          VERSION: ${{ steps.find.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git branch -f atlas-rebased HEAD
          git bundle create "$RUNNER_TEMP/atlas.bundle" "$EXPECTED..atlas-rebased"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          tip=$(git rev-parse HEAD)
          if [[ "$DRY_RUN" == true ]]; then
            echo "### Dry run: would push main at $tip (Atlas's patches on $TAG, was $EXPECTED) and release Atlas $VERSION; nothing was pushed or released" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Ready to push main at $tip (Atlas's patches on $TAG, was $EXPECTED) and release Atlas $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.bundle.outputs.ok == 'true'
        with:
          name: bundle
          path: ${{ runner.temp }}/atlas.bundle
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('report/**') != ''
        with:
          name: report
          path: report/
          retention-days: 3

  publish:
    needs: build
    # Never in a dry run (a by-hand run with dry_run on): the build summary says what would have been pushed.
    if: github.ref == 'refs/heads/main' && needs.build.outputs.ok == 'true' && !inputs.dry_run
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # The only job that holds SYNC_TOKEN. It runs no code from the repository: no cargo, no script of the checkout; it
    # moves the bundle's commits with git and starts the release.
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: bundle
          path: bundle
      - name: The outputs of build, checked (they are untrusted strings)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          EXPECTED: ${{ needs.build.outputs.expected }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1; }
          [[ "$TAG" =~ ^launcher@[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be launcher@X.Y.Z, got '$TAG'"; exit 1; }
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected must be a commit, got '$EXPECTED'"; exit 1; }
      - name: Push main
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          EXPECTED: ${{ needs.build.outputs.expected }}
        run: |
          set -euo pipefail
          git fetch --no-tags bundle/atlas.bundle atlas-rebased:refs/atlas/rebased
          tip=$(git rev-parse refs/atlas/rebased)
          basic=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          git -c http.extraheader="AUTHORIZATION: basic $basic" push --force-with-lease="main:$EXPECTED" origin "$tip:refs/heads/main"
          echo "### Pushed main at $tip" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the release
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh workflow run atlas-release.yml --ref main -f version="$VERSION" -f upstream_tag="$TAG" -f dry_run=false
          echo "### Release $VERSION (on $TAG) started" >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: build
    # The failure of build (title.txt, body.md), and the notice that upstream changed the launcher's build
    # (notice-title.txt, notice-body.md), which does not fail the run.
    if: always() && (needs.build.result == 'failure' || needs.build.outputs.notice == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: report
          path: report
      - name: An issue for each report, unless one with that title is open
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          titles=$(gh issue list --state open --limit 200 --json title --jq '.[].title')
          for kind in "title.txt body.md" "notice-title.txt notice-body.md"; do
            read -r title_file body_file <<<"$kind"
            [[ -f "report/$title_file" && -f "report/$body_file" ]] || continue
            title=$(head -n 1 "report/$title_file" | head -c 250)
            if grep -Fxq -- "$title" <<<"$titles"; then
              echo "An issue titled '$title' is already open"
            else
              gh issue create --title "$title" --body-file "report/$body_file"
            fi
          done

  main-check:
    # Once a day: on the 04:17 UTC schedule (github.event.schedule is the cron text that fired) and on a by-hand run.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || github.event.schedule == '17 4 * * *')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Upstream's launcher tags and main
        run: |
          git config user.name "atlas-sync"
          git config user.email "atlas-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream '+refs/tags/launcher@*:refs/upstream/tags/launcher@*'
          git fetch --no-tags upstream '+refs/heads/main:refs/remotes/upstream/main'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-sync-main
      - name: Linux libraries GPUI links to
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Atlas's patches on upstream's main, checked
        run: |
          # A throwaway branch of this runner: nothing is pushed.
          status=0
          rebase_failed=false
          # The tool is copied first: a rebase stopped on a conflict may not have it in the working tree.
          cp tools/atlas_sync.py "$RUNNER_TEMP/atlas_sync.py"
          # Chained with &&: set -e does not apply inside a group that is followed by ||.
          # diff3: a conflict block also shows the original code.
          {
            base=$(python3 tools/atlas_sync.py base) &&
            git checkout -q -b atlas-main-check &&
            git -c merge.conflictStyle=diff3 rebase --onto upstream/main "refs/upstream/tags/$base"
          } > "$RUNNER_TEMP/check.log" 2>&1 || status=$?
          if [[ $status != 0 ]]; then
            rebase_failed=true
            # Stopped on a conflict: say where, what upstream changed and what the patch changes, then abort.
            if python3 "$RUNNER_TEMP/atlas_sync.py" --repo "$PWD" conflict-report "$base" upstream/main > "$RUNNER_TEMP/conflict.md" 2>> "$RUNNER_TEMP/check.log"; then
              git rebase --abort || true
            fi
          else
            cargo check --manifest-path launcher/Cargo.toml --release > "$RUNNER_TEMP/cargo.log" 2>&1 || status=$?
          fi
          tail -n 60 "$RUNNER_TEMP/check.log"
          if [[ -f "$RUNNER_TEMP/cargo.log" ]]; then tail -n 60 "$RUNNER_TEMP/cargo.log"; fi
          [[ $status == 0 ]] && exit 0
          mkdir report
          printf '%s\n' "Atlas's patches do not apply to or build on upstream's main" > report/title.txt
          {
            echo "Rebasing Atlas's patches onto upstream's main, or \`cargo check --release\` of the result, failed. This is an early warning for the next upstream launcher release: nothing was pushed or published."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [[ $rebase_failed == true && -s "$RUNNER_TEMP/conflict.md" ]]; then
              cat "$RUNNER_TEMP/conflict.md"
            elif [[ $rebase_failed == true ]]; then
              echo '````'
              tail -n 60 "$RUNNER_TEMP/check.log"
              echo '````'
            else
              echo 'The first 150 error lines of `cargo check --release`:'
              echo
              echo '````'
              if grep -q '^error' "$RUNNER_TEMP/cargo.log"; then
                grep -A12 '^error' "$RUNNER_TEMP/cargo.log" | head -n 150
              else
                tail -n 60 "$RUNNER_TEMP/cargo.log"
              fi
              echo '````'
            fi
          } > "$RUNNER_TEMP/body.md"
          head -c 60000 "$RUNNER_TEMP/body.md" > report/body.md
          exit 1
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('report/title.txt') != ''
        with:
          name: report-main
          path: report/
          retention-days: 3

  report-main:
    needs: main-check
    if: always() && needs.main-check.result == 'failure'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: report-main
          path: report
      - name: An issue labelled sync-main, unless one is open
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          # Fails the same way when the label exists already.
          gh label create sync-main --color D93F0B --description "Atlas's patches against upstream's main" || true
          open=$(gh issue list --state open --label sync-main --json number --jq 'length')
          if [[ "$open" != 0 ]]; then
            echo "A sync-main issue is already open"
          else
            gh issue create --label sync-main --title "$(head -n 1 report/title.txt | head -c 250)" --body-file report/body.md
          fi
